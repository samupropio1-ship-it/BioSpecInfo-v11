name = "spectra-proxy"
main = "spectra-proxy.js"
compatibility_date = "2026-01-01"

[vars]
# Origini ammesse, separate da virgola. Lasciarlo vuoto significa "chiunque":
# sconsigliato, perche' chiunque scopra l'indirizzo consuma la tua quota.
ORIGINI = "https://samupropio1-ship-it.github.io"

# Tetti di sicurezza. Servono a non farti prosciugare la quota gratuita in
# un pomeriggio se qualcuno trova l'indirizzo del proxy.
LIMITE_IP = "20"        # richieste al minuto per singolo visitatore
TETTO_GIORNO = "2000"   # richieste totali al giorno
VOCE_TESTO_MAX = "1000"          # caratteri per richiesta di voce
VOCE_CARATTERI_GIORNO = "20000"  # caratteri di voce al giorno (ElevenLabs si paga a caratteri)

# ATTENZIONE: le chiavi NON vanno qui — questo file finisce su GitHub.
# Si impostano come segreti, che restano solo su Cloudflare:
#   npx wrangler secret put GROQ_KEYS        (il cavallo da tiro)
#   npx wrangler secret put GEMINI_KEYS      (documenti lunghi)
#   npx wrangler secret put NVIDIA_KEYS      (solo via proxy: dal browser NVIDIA non risponde)
#   npx wrangler secret put ZAI_KEYS         (rincalzo senza scadenza)
#   npx wrangler secret put ELEVENLABS_KEYS  (la voce di Spectra: POST /voce)
#   npx wrangler secret put SPECTRA_VOICE_ID (l'ID della voce progettata: il client non lo sceglie)
