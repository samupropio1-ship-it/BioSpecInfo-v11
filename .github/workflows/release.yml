# ═══════════════════════════════════════════════════════════════════════════
# Pubblicazione di una versione
#
# PERCHE' QUESTO WORKFLOW ESISTE
#
# Le credenziali con cui si lavora al repository da una sessione remota sono
# autorizzate a scrivere sui rami (`refs/heads/*`) e NON sui tag: la spinta di
# un tag torna 403 sulla POST a `git-receive-pack`, mentre un ramo nuovo passa.
# Senza tag non c'e' release, e la release era chiesta.
#
# Il token di Actions, invece, scrive sul repository che lo ospita. Quindi la
# versione si pubblica da qui: si avvia a mano (Actions → release → Run
# workflow), crea il tag sul commit indicato, apre la release e le allega i tre
# pacchetti di consegna. L'archivio completo — `models/` incluse — lo genera
# GitHub da se' come «Source code (zip)».
#
# Le note non si scrivono due volte: si prendono dalla voce del CHANGELOG che
# porta lo stesso nome della versione. Se quella voce non c'e', il workflow
# fallisce invece di pubblicare una release muta.
# ═══════════════════════════════════════════════════════════════════════════
name: release

on:
  workflow_dispatch:
    inputs:
      versione:
        # NESSUN VALORE PREDEFINITO, e la ragione è costata una release.
        # Qui c'era `default: 'bsi-v181'`. Avviato senza compilare il campo,
        # il workflow ha ripubblicato bsi-v181 con i pacchetti della v187,
        # allegandoglieli accanto ai suoi, e — essendo rieseguibile — ha
        # SPOSTATO il tag bsi-v181 dal commit della v181 a quello della v187.
        # Tutti i passi sono finiti «success»: il workflow ha fatto
        # esattamente quello che gli era stato detto. Un valore predefinito
        # che nomina una versione è una trappola che scatta in silenzio.
        description: 'Versione da pubblicare, come nel CHANGELOG (es. bsi-v187)'
        required: true
      titolo:
        description: 'Titolo della release (vuoto = «BioSpecInfo <versione>»)'
        required: false
        default: ''
      motivo_versione_diversa:
        description: 'Compilare SOLO per ripubblicare una versione diversa da quella del codice: scrivere il perché'
        required: false
        default: ''
      commit_del_tag:
        description: 'SHA su cui mettere il tag (vuoto = il commit di questo workflow). Serve a rimettere a posto un tag spostato'
        required: false
        default: ''
      solo_riparazione:
        description: 'true = non carica pacchetti: rimette il tag e toglie gli allegati estranei'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - name: Prendi il repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: La versione pubblicata deve essere quella che il codice dichiara
        run: |
          set -euo pipefail
          VER="${{ inputs.versione }}"
          MOTIVO="${{ inputs.motivo_versione_diversa }}"
          if [ -z "$VER" ]; then
            echo "::error::nessuna versione indicata"
            exit 1
          fi
          # Due testimoni indipendenti, entrambi nel repository:
          #   · la cache del Service Worker, che è la versione dell'app;
          #   · il nome dei pacchetti, che dice da quale versione provengono.
          SW=$(sed -n "s/^var CACHE = '\\(bsi-v[0-9]\\+\\)';.*/\\1/p" sw.js | head -1)
          PAC=$(ls -1 consegna/*.zip 2>/dev/null | sed -n 's/.*-\(bsi-v[0-9]\+\)\.zip$/\1/p' | sort -u | tr '\n' ' ')
          echo "versione chiesta:      $VER"
          echo "versione in sw.js:     $SW"
          echo "versione dei pacchetti: $PAC"
          OK=1
          [ "$VER" = "$SW" ] || OK=0
          [ "$PAC" = "$VER " ] || OK=0
          if [ "$OK" -eq 1 ]; then
            echo "i tre concordano"
            exit 0
          fi
          # Ripubblicare una versione passata è legittimo, ma deve essere
          # DETTO: un motivo scritto a mano non si compila per sbaglio, un
          # valore predefinito sì.
          if [ -n "$MOTIVO" ]; then
            echo "::warning::versione diversa da quella del codice, motivo dichiarato: $MOTIVO"
            exit 0
          fi
          echo "::error::la versione chiesta ($VER) non è quella del codice (sw.js: $SW, pacchetti: $PAC). Se è voluto, compilare «motivo_versione_diversa»."
          exit 1

      - name: Ricava le note dal CHANGELOG
        id: note
        run: |
          set -euo pipefail
          VER="${{ inputs.versione }}"
          # la voce del CHANGELOG che porta esattamente questo nome
          awk -v v="## [$VER]" '
            index($0, v) == 1 { dentro = 1; next }
            /^## \[/         { dentro = 0 }
            dentro           { print }
          ' CHANGELOG.md > note.md
          # Una release senza note e' peggio di nessuna release: sembra una
          # versione e non dice che cosa cambia.
          RIGHE=$(grep -c '[^[:space:]]' note.md || true)
          echo "righe utili nelle note: $RIGHE"
          if [ "$RIGHE" -lt 5 ]; then
            echo "::error::nel CHANGELOG non c'è una voce ## [$VER] con del contenuto"
            exit 1
          fi
          # Ogni voce del CHANGELOG finisce con il separatore che la stacca
          # dalla precedente. Lasciarlo mostrava due righe orizzontali di
          # seguito sulla pagina della release.
          awk '{ r[n++] = $0 }
               END { while (n > 0 && (r[n-1] == "" || r[n-1] == "---")) n--;
                     for (i = 0; i < n; i++) print r[i] }' note.md > note.tagliate
          mv note.tagliate note.md
          {
            echo ''
            echo '---'
            echo ''
            echo '**Che cosa scaricare**'
            echo ''
            echo '- *Source code (zip)* qui sotto è **tutto**: applicazione, codice,'
            echo '  documentazione in italiano e inglese, i banchi di prova e le strutture'
            echo '  3D di `models/` (~124 MB).'
            echo '- I tre pacchetti allegati sono i soli documenti, divisi per destinatario:'
            echo '  `AZIENDA` per una valutazione tecnica, `TESI` per la commissione,'
            echo '  `COMPLETO` tutto compreso.'
            echo "- Per **usare** l'applicazione non serve scaricare niente: è una PWA,"
            echo '  si apre da <https://samupropio1-ship-it.github.io/BioSpecInfo-v11/>.'
          } >> note.md
          echo "file=note.md" >> "$GITHUB_OUTPUT"

      - name: Controlla che i pacchetti ci siano
        run: |
          set -euo pipefail
          # Un allegato mancante renderebbe la release incompleta in silenzio.
          QUANTI=$(ls -1 consegna/*.zip 2>/dev/null | wc -l)
          ls -lh consegna/*.zip || true
          if [ "$QUANTI" -lt 3 ]; then
            echo "::error::attesi 3 pacchetti in consegna/, trovati $QUANTI"
            exit 1
          fi

      - name: Crea il tag e la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ inputs.versione }}"
          TIT="${{ inputs.titolo }}"
          [ -n "$TIT" ] || TIT="BioSpecInfo $VER"
          # Rieseguibile: se la release c'è già si aggiornano note e allegati
          # invece di fallire a metà.
          SHA_TAG="${{ inputs.commit_del_tag }}"
          [ -n "$SHA_TAG" ] || SHA_TAG="${{ github.sha }}"
          RIPARA="${{ inputs.solo_riparazione }}"
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "la release $VER esiste: aggiorno note, allegati e tag"
            gh release edit "$VER" --title "$TIT" --notes-file note.md
            if [ "$RIPARA" != "true" ]; then
              gh release upload "$VER" consegna/*.zip --clobber
            else
              echo "solo riparazione: nessun pacchetto caricato"
            fi
            # IGIENE. Un allegato il cui nome porta una versione DIVERSA da
            # quella della release non ci appartiene: è così che bsi-v181 si
            # è trovata sei pacchetti, tre suoi e tre della v187. Chi scarica
            # non ha modo di sapere quale sia quello giusto.
            gh release view "$VER" --json assets \
              --jq '.assets[].name' | while read -r NOME; do
              case "$NOME" in
                *"$VER"*) : ;;
                *) echo "rimuovo l'allegato estraneo: $NOME"
                   gh release delete-asset "$VER" "$NOME" -y ;;
              esac
            done
            # `gh release edit` NON sposta il tag. Senza questa riga l'archivio
            # «Source code (zip)», che GitHub genera dal tag, resterebbe al
            # commit della prima pubblicazione mentre i pacchetti allegati
            # verrebbero da questo: una release con due provenienze diverse e
            # nulla che lo dica. Una release, un commit.
            gh api -X PATCH "repos/${{ github.repository }}/git/refs/tags/$VER" \
              -f sha="$SHA_TAG" -F force=true >/dev/null
          else
            gh release create "$VER" \
              --target "$SHA_TAG" \
              --title "$TIT" \
              --notes-file note.md \
              consegna/*.zip
          fi
          echo "— pubblicata:"
          gh release view "$VER" --json tagName,name,assets \
            --jq '"\(.tagName) · \(.name) · allegati: \(.assets | length)"'

      - name: Il tag e gli allegati devono venire dallo stesso commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VER="${{ inputs.versione }}"
          # Non si dà per buono che il passo precedente abbia funzionato: si
          # chiede a GitHub dove punta il tag adesso e lo si confronta con il
          # commit su cui sta girando questo workflow, che è quello da cui
          # sono stati presi i pacchetti.
          RIF=$(gh api "repos/${{ github.repository }}/git/ref/tags/$VER" \
                  --jq '.object.sha + " " + .object.type')
          SHA="${RIF% *}"; TIPO="${RIF#* }"
          if [ "$TIPO" = "tag" ]; then
            SHA=$(gh api "repos/${{ github.repository }}/git/tags/$SHA" --jq '.object.sha')
          fi
          ATTESO="${{ inputs.commit_del_tag }}"
          [ -n "$ATTESO" ] || ATTESO="${{ github.sha }}"
          echo "tag $VER → $SHA"
          echo "atteso          → $ATTESO"
          if [ "$SHA" != "$ATTESO" ]; then
            echo "::error::il tag punta a $SHA ma era atteso $ATTESO"
            exit 1
          fi
          echo "coincidono"

      - name: Togli il ramo di prova lasciato indietro
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `prova-permessi-refs` è nato da una verifica dei permessi sui ref:
          # le credenziali della sessione remota possono creare rami ma non
          # cancellarli, quindi è rimasto sul repository. Qui si può.
          if git ls-remote --exit-code --heads origin prova-permessi-refs >/dev/null 2>&1; then
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/prova-permessi-refs"
            echo "ramo prova-permessi-refs rimosso"
          else
            echo "nessun ramo di prova da rimuovere"
          fi
